[project]
name = "financial-wellness-lab"
version = "0.1.0"
description = "Where consumer-credit decisions should be deterministic, and where language belongs"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.17.0",
    "python-dotenv>=1.2.2",
    "PyYAML>=6.0.3",
    "streamlit>=1.61.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[tool.setuptools.packages.find]
include = ["eligibility*", "card_economics*", "ewa_sim*", "shared*"]

[tool.pytest.ini_options]
testpaths = ["eligibility", "card_economics", "tests"]
