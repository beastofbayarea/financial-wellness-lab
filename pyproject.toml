[project]
name = "financial-wellness-lab"
version = "0.1.0"
description = "Where consumer-credit decisions should be deterministic, and where language belongs"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["eligibility*", "card_economics*", "ewa_sim*", "shared*"]

[tool.pytest.ini_options]
testpaths = ["eligibility", "card_economics"]
