[theme]
base = "dark"
primaryColor = "#6366F1"
backgroundColor = "#090D16"
secondaryBackgroundColor = "#111827"
textColor = "#E2E8F0"
linkColor = "#818CF8"
borderColor = "rgba(255, 255, 255, 0.08)"
showWidgetBorder = true
baseRadius = "none"
buttonRadius = "none"

[theme.sidebar]
backgroundColor = "#0B0F19"
secondaryBackgroundColor = "#111827"
textColor = "#E2E8F0"

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = false
toolbarMode = "minimal"
